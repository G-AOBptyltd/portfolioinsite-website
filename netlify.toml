[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.agilityops.com.au https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://cdn.jsdelivr.net; frame-ancestors 'none'"

# ===== API Proxy =====
# Proxy /api/cms to central AOB API (avoids CORS issues for client-side fetches)
[[redirects]]
  from = "/api/cms"
  to = "https://api.agilityops.com.au/api/cms"
  status = 200
  force = true

# ===== SPA-style Content Routes =====
# /product/* → product detail page (dynamic slug routing)
[[redirects]]
  from = "/product/*"
  to = "/pages/product.html"
  status = 200

# /content/* → content detail page (dynamic slug routing)
[[redirects]]
  from = "/content/*"
  to = "/pages/content.html"
  status = 200

# ===== Tools (PortfolioInSite Suite) =====
# Clean URLs for InSite Suite tools hosted on portfolioinsite.app
[[redirects]]
  from = "/tools/planinsite"
  to = "/tools/planinsite.html"
  status = 200

[[redirects]]
  from = "/tools/forecastinsite"
  to = "/tools/forecastinsite.html"
  status = 200

[[redirects]]
  from = "/tools/portfolioinsite"
  to = "/tools/portfolioinsite.html"
  status = 200

# ===== Pricing =====
# Central pricing page lives on agilityops.com.au — redirect there (single source of truth)
[[redirects]]
  from = "/pricing"
  to = "https://agilityops.com.au/pages/pricing"
  status = 302

# ===== Playbook =====
[[redirects]]
  from = "/playbook"
  to = "/pages/forecastinsite-playbook.html"
  status = 200

# ===== Module Teasers (PortfolioInSite Jira App) =====
[[redirects]]
  from = "/modules/*"
  to = "/pages/module.html"
  status = 200

# ===== ForecastInSite Module Teasers =====
[[redirects]]
  from = "/forecastinsite/*"
  to = "/pages/forecastinsite-module.html"
  status = 200

# ===== 404 Fallback =====
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
